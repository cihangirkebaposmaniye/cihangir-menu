<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cihangir Kebap Menü</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
background:
radial-gradient(circle at top,#3a1800,#000);
color:white;
min-height:100vh;
padding:20px;
text-align:center
}

.logo-circle{
width:90px;
height:90px;
border-radius:50%;
border:2px solid #ffb52e;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:40px;
background:#1a0c00;
box-shadow:0 0 30px rgba(255,166,0,.5);
animation:pulse 2s infinite
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.05)}
}

h1{
margin-top:15px;
font-size:36px
}

.subtitle{
color:#ffb52e;
margin-top:8px
}

/* TABAK */

.plate-area{
position:relative;
margin:35px auto;
width:270px;
height:270px
}

.smoke{
position:absolute;
width:130px;
height:130px;
background:rgba(255,255,255,.1);
border-radius:50%;
filter:blur(25px);
animation:smoke 4s infinite
}

.smoke1{
top:20px;
left:0
}

.smoke2{
top:0;
right:0;
animation-delay:2s
}

@keyframes smoke{
0%{
transform:translateY(30px) scale(.7);
opacity:0
}
50%{
opacity:1
}
100%{
transform:translateY(-80px) scale(1.5);
opacity:0
}
}

.plate{
width:100%;
height:100%;
border-radius:50%;
background:
radial-gradient(circle,#fff 50%,#ddd 51%,#f5f5f5 70%);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
box-shadow:0 0 50px rgba(255,166,0,.45);
animation:rotatePlate 18s linear infinite
}

@keyframes rotatePlate{
100%{
transform:rotate(360deg)
}
}

.plate img{
width:88%;
height:88%;
object-fit:cover;
border-radius:50%
}

/* KATEGORİLER */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
max-width:700px;
margin:35px auto
}

.cat-btn{
background:#120700;
border:1px solid #5c3a00;
border-radius:24px;
padding:18px;
cursor:pointer;
box-shadow:0 0 20px rgba(255,140,0,.18);
transition:.3s
}

.cat-btn:hover{
transform:scale(1.04);
box-shadow:0 0 35px rgba(255,166,0,.5)
}

.cat-img{
width:100px;
height:100px;
object-fit:cover;
border-radius:18px;
border:2px solid #ffb52e;
margin-bottom:12px
}

.cat-btn span{
font-size:20px;
font-weight:bold;
color:#ffb52e
}

/* ÜRÜNLER */

#products{
display:grid;
gap:20px;
max-width:850px;
margin:30px auto
}

.product{
background:#120700;
border-radius:24px;
padding:18px;
border:1px solid #5c3a00;
box-shadow:0 0 20px rgba(255,140,0,.18)
}

.product img{
width:100%;
max-height:330px;
object-fit:cover;
border-radius:20px;
margin-bottom:15px
}

.product h2{
color:#ffb52e;
font-size:27px;
margin-bottom:10px
}

.price-line{
background:#1f0d00;
border:1px solid #5c3a00;
border-radius:14px;
padding:10px;
margin:8px 0;
text-align:left
}

.price-line strong{
color:#ffb52e;
font-size:21px
}

.price-line small{
display:block;
color:#ddd;
margin-top:4px;
font-size:14px
}

.footer{
margin-top:40px;
color:#aaa;
font-size:14px
}

@media(max-width:768px){

h1{
font-size:31px
}

.plate-area{
width:245px;
height:245px
}

.cat-img{
width:86px;
height:86px
}

.cat-btn span{
font-size:17px
}

}
</style>
</head>

function showCategory(category){

const productsDiv=document.getElementById("products");

productsDiv.innerHTML="";

menu[category].forEach(product=>{

let priceHtml="";

product.prices.forEach(p=>{

priceHtml += `
<div class="price-line">
<strong>${p[0]}</strong> ${p[1]}
<small>${p[2]}</small>
</div>
`;

});

productsDiv.innerHTML += `

<div class="product">

${product.image ? `<img src="${product.image}">` : ""}

<h2>${product.name}</h2>

${priceHtml}

</div>

`;

});

if(menu[category][0].image){
document.getElementById("plateImage").src =
menu[category][0].image;
}

window.scrollTo({
top:620,
behavior:"smooth"
});

}
