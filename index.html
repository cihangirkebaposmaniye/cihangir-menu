<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cihangir Kebap QR Menü</title>

<style>

:root{
--gold:#d7a84f;
--gold2:#ffcf72;
--bg:#090705;
--card:#15100b;
--text:#fff8ea;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:
radial-gradient(circle at top, rgba(255,140,0,.15), transparent 30%),
linear-gradient(180deg,#130904,#020202);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

.container{
width:min(430px,100%);
margin:auto;
padding:20px 15px 40px;
}

.logo{
width:90px;
height:90px;
margin:10px auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:
radial-gradient(circle, rgba(255,255,255,.2), transparent),
linear-gradient(145deg,#2a1709,#050302);
border:2px solid var(--gold);
box-shadow:0 0 30px rgba(215,168,79,.3);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-8px);
}
}

.title{
text-align:center;
font-size:28px;
font-weight:bold;
letter-spacing:1px;
margin-top:10px;
}

.subtitle{
text-align:center;
color:var(--gold2);
margin-top:5px;
font-size:14px;
}

.plate-area{
position:relative;
margin-top:30px;
min-height:320px;
}

.smoke{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:radial-gradient(circle, rgba(255,255,255,.25), transparent 70%);
filter:blur(20px);
animation:smoke 4s infinite;
opacity:.3;
}

.smoke:nth-child(1){
left:40%;
top:60%;
}

.smoke:nth-child(2){
left:20%;
top:70%;
animation-delay:1s;
}

.smoke:nth-child(3){
left:60%;
top:65%;
animation-delay:2s;
}

@keyframes smoke{
0%{
transform:translateY(20px) scale(.5);
opacity:0;
}
30%{
opacity:.3;
}
100%{
transform:translateY(-150px) scale(1.5);
opacity:0;
}
}

.plate{
width:240px;
height:240px;
border-radius:50%;
margin:auto;
position:relative;
background:
radial-gradient(circle at center,
#fff 0 40%,
#ddd 41% 52%,
#fff 53% 100%);
box-shadow:
0 20px 40px rgba(0,0,0,.6),
inset 0 10px 20px rgba(255,255,255,.8);
animation:plateMove 4s ease-in-out infinite;
}

@keyframes plateMove{
0%,100%{
transform:rotate(-2deg);
}
50%{
transform:rotate(2deg);
}
}

.plate-text{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:#2b1707;
font-weight:bold;
z-index:5;
}

.plate-text h2{
font-size:28px;
}

.plate-text span{
font-size:13px;
margin-top:5px;
}

.food{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
font-size:70px;
z-index:4;
animation:foodShow .4s ease;
}

@keyframes foodShow{
from{
transform:scale(.3);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;
}

.cat-btn,
.item,
.back{
background:
linear-gradient(145deg, rgba(25,17,10,.95), rgba(5,3,2,.95));
border:1px solid rgba(215,168,79,.3);
border-radius:18px;
padding:15px;
color:white;
cursor:pointer;
transition:.2s;
}

.cat-btn:active,
.item:active,
.back:active{
transform:scale(.96);
}

.cat-btn{
text-align:center;
}

.cat-btn .icon{
font-size:30px;
margin-bottom:6px;
}

.cat-btn .name{
color:var(--gold2);
font-weight:bold;
}

.screen{
display:none;
animation:fade .3s ease;
}

.screen.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateX(20px);
}
to{
opacity:1;
transform:translateX(0);
}
}

.screen-title{
text-align:center;
margin:15px 0;
font-size:24px;
color:var(--gold2);
}

.item-list{
display:grid;
gap:10px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
}

.item strong{
display:block;
font-size:16px;
}

.item small{
display:block;
margin-top:5px;
color:#bbb;
}

.price{
font-size:20px;
font-weight:bold;
color:var(--gold2);
}

.detail{
text-align:center;
}

.detail h1{
font-size:30px;
color:var(--gold2);
margin-bottom:10px;
}

.detail p{
color:#ccc;
line-height:1.5;
margin-bottom:15px;
}

.big-price{
display:inline-block;
padding:12px 25px;
border-radius:999px;
background:
linear-gradient(145deg,var(--gold),#8e6320);
color:#1a0d04;
font-size:30px;
font-weight:bold;
box-shadow:0 0 30px rgba(255,207,114,.3);
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.05);
}
}

.back{
margin-top:20px;
display:inline-block;
color:var(--gold2);
font-weight:bold;
}

.footer{
text-align:center;
margin-top:25px;
font-size:12px;
color:#888;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">🔥</div>

<div class="title">CİHANGİR KEBAP</div>
<div class="subtitle">Gerçek Adana Lezzeti</div>

<div class="plate-area">

<div class="smoke"></div>
<div class="smoke"></div>
<div class="smoke"></div>

<div class="plate">

<div class="food" id="food">🥩</div>

<div class="plate-text" id="plateText">
<h2>MENÜ</h2>
<span>Kategori Seçiniz</span>
</div>

</div>

</div>

<div id="home" class="screen active">

<div class="categories">

<div class="cat-btn" onclick="openCategory('Izgara')">
<div class="icon">🔥</div>
<div class="name">IZGARA</div>
</div>

<div class="cat-btn" onclick="openCategory('Fırın')">
<div class="icon">🍕</div>
<div class="name">FIRIN</div>
</div>

<div class="cat-btn" onclick="openCategory('Dürümler')">
<div class="icon">🌯</div>
<div class="name">DÜRÜMLER</div>
</div>

<div class="cat-btn" onclick="openCategory('İçecekler')">
<div class="icon">🥤</div>
<div class="name">İÇECEKLER</div>
</div>

</div>

</div>

<div id="category" class="screen">

<div class="screen-title" id="categoryTitle"></div>

<div class="item-list" id="itemList"></div>

<div style="text-align:center">
<div class="back" onclick="goHome()">← Geri</div>
</div>

</div>

<div id="detail" class="screen detail">

<h1 id="detailName"></h1>

<p id="detailDesc"></p>

<div class="big-price" id="detailPrice"></div>

<br>

<div class="back" onclick="backCategory()">← Ürünlere Dön</div>

</div>

<div class="footer">
QR Menü • Osmaniye
</div>

</div>

<script>

const menu = {

"Izgara":[

{
name:"Adana Kebap",
price:"390 ₺",
icon:"🍢",
desc:"6 çeşit meze ile servis edilir."
},

{
name:"Kuşbaşı Kebap",
price:"390 ₺",
icon:"🥩",
desc:"Köz sebzeler ve lavaş ile servis edilir."
},

{
name:"Kuzu Şiş",
price:"390 ₺",
icon:"🍖",
desc:"Özel marine edilmiş kuzu eti."
}

],

"Fırın":[

{
name:"Lahmacun",
price:"120 ₺",
icon:"🍕",
desc:"Taş fırın lahmacun."
}

],

"Dürümler":[

{
name:"Adana Dürüm",
price:"220 ₺",
icon:"🌯",
desc:"Bol garnitürlü adana dürüm."
}

],

"İçecekler":[

{
name:"Ayran",
price:"40 ₺",
icon:"🥛",
desc:"Soğuk ayran."
}

]

};

let currentCategory = "";

function setScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}

function openCategory(category){

currentCategory = category;

document.getElementById("categoryTitle")
.innerText = category.toUpperCase();

const itemList =
document.getElementById("itemList");

itemList.innerHTML = "";

menu[category].forEach(item=>{

const div = document.createElement("div");

div.className = "item";

div.innerHTML = `
<div>
<strong>${item.icon} ${item.name}</strong>
<small>${item.desc}</small>
</div>

<div class="price">${item.price}</div>
`;

div.onclick = ()=>openDetail(item);

itemList.appendChild(div);

});

document.getElementById("plateText")
.innerHTML = `
<h2>${category.toUpperCase()}</h2>
<span>Ürün Seçiniz</span>
`;

document.getElementById("food")
.style.display = "none";

setScreen("category");

}

function openDetail(item){

document.getElementById("detailName")
.innerText = item.name.toUpperCase();

document.getElementById("detailDesc")
.innerText = item.desc;

document.getElementById("detailPrice")
.innerText = item.price;

const food =
document.getElementById("food");

food.innerText = item.icon;

food.style.display = "flex";

document.getElementById("plateText")
.innerHTML = "";

setScreen("detail");

}

function backCategory(){

openCategory(currentCategory);

}

function goHome(){

document.getElementById("food")
.style.display = "none";

document.getElementById("plateText")
.innerHTML = `
<h2>MENÜ</h2>
<span>Kategori Seçiniz</span>
`;

setScreen("home");

}

</script>

</body>
</html>
