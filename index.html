<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cihangir Kebap Menü</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:radial-gradient(circle at top,#3a1800,#000);color:white;min-height:100vh;padding:20px;text-align:center}
.logo-circle{width:90px;height:90px;border-radius:50%;border:2px solid #ffb52e;display:flex;align-items:center;justify-content:center;margin:auto;background:#1a0c00;box-shadow:0 0 30px rgba(255,166,0,.5);animation:pulse 2s infinite;overflow:hidden}
.logo-circle img{width:86px;height:86px;object-fit:contain}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1{margin-top:15px;font-size:36px}.subtitle{color:#ffb52e;margin-top:8px}
.plate-area{position:relative;margin:35px auto;width:280px;height:280px}
.smoke{position:absolute;width:140px;height:140px;background:rgba(255,255,255,.12);border-radius:50%;filter:blur(30px);animation:smoke 4s infinite}
.smoke1{top:10px;left:0}.smoke2{top:0;right:0;animation-delay:2s}
@keyframes smoke{0%{transform:translateY(30px) scale(.7);opacity:0}50%{opacity:1}100%{transform:translateY(-90px) scale(1.6);opacity:0}}
.plate{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#fff 52%,#ddd 53%,#f5f5f5 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 55px rgba(255,166,0,.5);animation:rotatePlate 20s linear infinite}
@keyframes rotatePlate{100%{transform:rotate(360deg)}}
.plate img{width:88%;height:88%;object-fit:contain;border-radius:50%}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:700px;margin:35px auto}
.cat-btn{background:#120700;border:1px solid #6d4200;border-radius:24px;padding:18px;cursor:pointer;box-shadow:0 0 25px rgba(255,140,0,.18);transition:.3s;display:flex;align-items:center;justify-content:center;gap:16px}
.cat-btn:hover{transform:scale(1.03);box-shadow:0 0 40px rgba(255,166,0,.45)}
.cat-img{width:95px;height:95px;object-fit:cover;border-radius:18px;border:2px solid #ffb52e}
.cat-btn span{font-size:20px;font-weight:bold;color:#ffb52e}
#products{display:grid;gap:20px;max-width:850px;margin:30px auto}
.product{background:#120700;border-radius:24px;padding:18px;border:1px solid #5c3a00;box-shadow:0 0 20px rgba(255,140,0,.18)}
.product img{width:100%;max-height:420px;object-fit:cover;border-radius:20px;margin-bottom:15px}
.product h2{color:#ffb52e;font-size:28px;margin-bottom:12px}
.price-line{background:#1f0d00;border:1px solid #5c3a00;border-radius:14px;padding:12px;margin:8px 0;text-align:left}
.price-line strong{color:#ffb52e;font-size:21px}
.price-line small{display:block;color:#ddd;margin-top:4px;font-size:14px}
.footer{margin-top:40px;color:#aaa;font-size:14px}
@media(max-width:768px){h1{font-size:30px}.plate-area{width:240px;height:240px}.categories{grid-template-columns:1fr}.cat-btn{padding:16px}.cat-img{width:80px;height:80px}.cat-btn span{font-size:18px}}
</style>
</head>

<body>

<div class="logo-circle">
<img src="cihangir.png">
</div>

<h1>CİHANGİR KEBAP</h1>
<div class="subtitle">Gerçek Adana Lezzeti</div>

<div class="plate-area">

<div class="smoke smoke2"></div>
<div class="plate">
<img src="cihangir.png">
</div>
</div>

<div class="categories">

</button>

<button class="cat-btn" onclick="showCategory('tavuk')">

<button class="cat-btn" onclick="showCategory('durum')">

<button class="cat-btn" onclick="showCategory('pide')">

<button class="cat-btn" onclick="showCategory('lahmacun')">

<button class="cat-btn" onclick="showCategory('icecek')">

</div>

function showCategory(category){
const productsDiv=document.getElementById("products");
productsDiv.innerHTML="";

menu[category].forEach(product=>{
let priceHtml="";
product.prices.forEach(p=>{
priceHtml+=`
<div class="price-line">
<strong>${p[0]}</strong> ${p[1]}
<small>${p[2]}</small>
</div>`;
});

productsDiv.innerHTML+=`
<div class="product">
${product.image ? `<img src="${product.image}" onerror="this.style.display='none'">` : ""}
<h2>${product.name}</h2>
${priceHtml}
</div>`;
});

window.scrollTo({top:620,behavior:"smooth"});
}

</html>
